download_yale_event_log:
  name: Download Yale Event Log
  description: Download the event log from the Yale API, optionally across multiple pages.
  fields:
    pages:
      description: "Number of pages to fetch, or '*' to fetch all available pages."
      required: false
      example: "2"
      selector:
        text:
    utc:
      description: "Return times in UTC (Yale set_utc=1) instead of the hub's local time, which may be off by an hour."
      required: false
      default: false
      example: true
      selector:
        boolean:
