name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.14"
      - name: Install test requirements
        run: pip install -r requirements_test.txt
      - name: Show Home Assistant version under test
        run: pip show homeassistant | head -2
      - name: Run tests
        run: pytest -v
