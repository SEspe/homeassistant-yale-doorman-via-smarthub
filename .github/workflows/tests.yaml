name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: ${{ matrix.name }}
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Latest Home Assistant"
            python-version: "3.14"
            requirements: "requirements_test.txt"
          - name: "Oldest supported Home Assistant"
            python-version: "3.12"
            requirements: "requirements_test_min.txt"
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test requirements
        run: pip install -r ${{ matrix.requirements }}
      - name: Show Home Assistant version under test
        run: pip show homeassistant | head -2
      - name: Run tests
        run: >-
          pytest -v
          --cov=custom_components.yale_doorman_via_smarthub
          --cov-report=term-missing
